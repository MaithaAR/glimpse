# GLIMPSE default configuration (mirrors the proposal's prespecified rules)
# Read and checked at startup by glimpse.config.GlimpseConfig: a missing, misspelled or out-of-range setting stops the program.
seed: 20260927                               # one number fixes Python, NumPy and PyTorch randomness (glimpse.utils.seed)
paths:
  outputs: outputs                           # metrics, figures, tables
  logs: logs                                 # glimpse.log (rotating)
data:
  cgmacros_root: data/cgmacros/CGMacros      # folder containing CGMacros-0XX/ and bio.csv
  nutrition5k_root: data/nutrition5k
  reference_sensor: dexcom                   # libre only for sensor-shift tests
label:
  spike_threshold_mgdl: 50
  sensitivity_thresholds: [30, 70]
  horizon_min: 120
  baseline_window_min: 30
window_rules:
  min_baseline_readings: 3
  min_post_coverage: 0.70
  max_gap_min: 20
  strict: {min_post_coverage: 0.90, max_gap_min: 10}
meals:
  min_share_eaten_pct: 10                     # below this, served-macro reconstruction is unusable
  exclude_next_meal_within_min: 120           # also reported separately
onboarding:
  hours: 72
  min_meals_for_personal_prior: 5             # else population prior from training target cohort
cohort:
  target_groups: [healthy, prediabetes]       # A1c < 5.7 healthy, 5.7-6.4 prediabetes, >= 6.5 T2D
splits:                                      # by PERSON: all meals of one person stay in one group
  locked_file: splits/locked_final_set.json  # 8 target people sealed in the proposal (SHA-256), used once at the end
  test_people: 5                             # fixed test group = outer CV fold 1 (rubric's held-out split, demo)
  validation_people: 4                       # fixed validation group (threshold selection)
cv:
  outer_folds: 5                             # main estimate: every development target person is tested once
  inner_folds: 4                             # inside the training people: tuning (e.g. number of epochs)
  seeds: [0, 1, 2]
costs:                                        # (spike, no_spike); assumptions, swept in sensitivity analysis
  low_risk: [5, 0]
  caution: [0, 1]
  abstain: [2, 0.5]
  sweep_missed_spike: [3, 5, 7, 10]
  sweep_abstain_multiplier: [0.5, 1, 2, 4]
pipeline:                                    # checks the product applies BEFORE any model (same rules as labelling)
  cgm_lookback_min: 120                      # model input = 2 h before the meal (24 x 5-min slots)
  min_cgm_readings_last_30min: 3
  min_cgm_coverage: 0.70                     # share of 5-min slots with a reading
  max_cgm_gap_min: 20
  glucose_range_mgdl: [40, 400]              # Dexcom reportable range
augment:                                     # training batches only; the stored data never change
  enabled: true                              # switch off to measure its effect (ablation)
  glucose_noise_mgdl: 3.0                    # small random wobble on real readings (below typical CGM error)
  hr_noise_bpm: 1.0
photo:                                       # pretrained photo model (carbohydrate estimate)
  arch: convnext_tiny.fb_in22k_ft_in1k       # timm name; ImageNet-22k pretraining, ImageNet-1k fine-tuning
  hf_repo: timm/convnext_tiny.fb_in22k_ft_in1k
  revision: bc48a87f119bae1b06418f5340bfa97ef75d4609   # exact Hugging Face commit (pinned)
  weights_sha256: 77b619e187de71bce58721689da0c009e84cc20677293d7d43105307e34d868a  # fingerprint of model.safetensors
  weights_dir: data/weights
  crop_pct: 1.0                              # keep as much of the plate as possible (no extra zoom-in crop)
  min_side_px: 64                            # smaller photos are rejected as unusable
  dropout: 0.2
  carb_bin_edges_g: [30, 60, 90]             # bins <30, 30-<60, 60-<90, >=90 g (an edge value goes to the upper bin)
finetune_cap_items: 10000                    # project limit: photos used to fine-tune, summed over the whole project
baselines:                                   # fixed before seeing results; every model gets the same folds and normaliser
  logreg_c_grid: [0.001, 0.003, 0.01, 0.03, 0.1, 1.0, 10.0]  # logistic regression strength C, tuned on the inner folds;
                                           # widened downwards in 4c because 0.01 (the old minimum) won 9 of 10 times
  gbm_depth_grid: [2, 3, 4]                  # gradient boosting (the proposal's baseline): tree depth tuned the same way
  ridge_alpha_grid: [1.0, 10.0, 100.0, 1000.0]  # frozen ConvNeXt + ridge carb baseline: strength tuned on the inner folds
fusion:                                      # meal information added to profile + trend (fixed before running 4c)
  bootstrap_draws: 2000                      # paired person bootstrap of the AUROC gain
  carbs_check_min_gain: 0.02                 # logged-carbs check: skip the photo CV only if the WHOLE 95% range is below this
  ridge_alpha_grid_posthoc: [1.0, 10.0, 100.0, 1000.0, 10000.0, 100000.0]  # POST-HOC (after 4c-2): ridge hit 1000 in all folds
prototype:                                   # the app (glimpse demo / predict / app); rules run before the model
  low_risk_below: 0.14285714285714285        # decision cut-offs = the frozen amendment (costs alone, no data); must match
  caution_from: 0.2                          #   checkpoints/thresholds_amended.json, which the app checks at start-up
  thresholds_file: checkpoints/thresholds_amended.json
  ood_reference_file: checkpoints/photo_ood_reference.pt
  min_photo_contrast: 8.0                    # near-blank photo (grey-level spread below this, 0-255 scale) -> can't judge
  ood_neighbours: 5                          # unfamiliar photo: mean distance to the 5 nearest training photos ...
  ood_quantile: 0.99                         # ... above the 99th percentile of the training photos' own distances
  feedback_file: outputs/feedback/feedback.jsonl  # mocked user feedback (what happened after the meal)
targets:                                     # fixed before seeing results (see docs/evaluation_protocol.md)
  primary_metric: auroc                      # target cohort, cross-validated out-of-fold predictions
  rq1_noninferiority_margin: 0.03
  rq2_min_lower_bound: 0.0                   # CNN "beats" engineered features only if the 95% range of the gain is above this
  ece_max: 0.05
  ece_bins: 15
  conformal_nominal: 0.80
  usefulness: {min_cost_reduction: 0.10, min_cleared: 0.20, max_missed_among_cleared: 0.10, max_abstain: 0.20}
  latency_p95_ms: 300
training:
  num_threads: 4                             # CPU threads (capped at the machine's count); fixed for repeatable runs
  scratch:                                   # SensorCNN, trained from scratch
    channels: 16
    hidden: 32
    dropout: 0.2
    lr: 0.001                                # AdamW learning rate (peak, after warm-up)
    weight_decay: 0.01
    batch_size: 64
    max_epochs: 60                           # upper limit while the inner folds look for the best epoch
    warmup_epochs: 3
    patience: 12                             # inner folds: stop after this many epochs without improvement
  photo:                                     # PhotoCarbModel (pretrained ConvNeXt-Tiny + 2 heads)
    lr_heads: 0.001
    lr_last_stage: 0.0001                    # 10x smaller: small changes to pretrained weights
    weight_decay: 0.05
    batch_size: 64
    max_epochs: 100                          # upper limit for the heads while the inner folds look for the best epoch
    warmup_epochs: 2
    patience: 10
    bin_loss_weight: 0.5                     # loss = Huber(log grams) + 0.5 x cross-entropy(carb bin)
    huber_delta: 1.0
    try_last_stage: true                     # phase-2 trial: also train the backbone's last stage
    last_stage_max_epochs: 3
    last_stage_min_gain_g: 0.5               # keep phase 2 only if the inner folds' carb error drops by >= 0.5 g
    augmented_views: 2                       # saved augmented copies per training photo (phase 2 only)
