# Proof that the project installs and passes its checks on a clean Linux machine (like the grader's container).
# Runs on every push. Tests that need the downloaded CGMacros data are skipped here (no data in the repository).
name: ci
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.14 + locked libraries (CPU-only PyTorch on Linux)
        run: uv sync --locked
      - name: Settings check
        run: uv run glimpse check-config
      - name: Code checks
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Tests
        run: uv run pytest
  data-pipeline:
    # Downloads the CGMacros CSVs (no photos, to stay quick), rebuilds the dataset and splits, trains the SensorCNN,
    # and checks that Linux produces exactly the committed person split.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Download CGMacros CSVs (PhysioNet, open access)
        run: uv run glimpse download-data --no-photos
      - name: Meal table, dataset, splits, normaliser, quality report
        run: uv run glimpse prepare
      - name: Same person split as the committed one
        run: git diff --exit-code splits/dev_splits.json
      - name: Train the from-scratch SensorCNN
        run: uv run glimpse train --model scratch
  container:
    # Builds the Linux container from the Dockerfile and runs it with the network switched off:
    # settings check + self-test (all frozen parts load from local files; the full prediction path runs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (locked libraries + pinned, hash-checked photo weights)
        run: docker build -t glimpse .
      - name: Settings check, offline
        run: docker run --rm --network none glimpse check-config
      - name: Self-test, offline
        run: docker run --rm --network none glimpse selftest
