[project]
name = "glimpse"
version = "0.1.0"
description = "GLIMPSE: pre-meal glucose-spike risk from a meal photo, the pre-meal CGM trend and a short profile, with calibrated risk and abstention."
authors = [{ name = "Maitha Alhosani", email = "maithaalhosani@icloud.com" }]
readme = "README.md"
requires-python = ">=3.14,<3.15"
# Runtime libraries, each with an allowed version range. More are added in the step that first needs them.
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "pyyaml>=6.0,<7",
  "torch>=2.9,<3",
  "pydantic>=2.10,<3",
  "loguru>=0.7,<1",
  "remotezip>=0.12,<1",
  "pillow>=11,<14",
]

# `uv run glimpse ...` runs glimpse.cli:main
[project.scripts]
glimpse = "glimpse.cli:main"

# Tools used only while developing (tests and code checks), kept apart from the product's libraries.
[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glimpse"]

# Linux (the grader's container) gets the small CPU-only PyTorch build instead of the multi-GB GPU build.
# macOS uses the normal PyPI build (it includes Apple-GPU support).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]
# Frozen proposal evidence (code + logs behind the proposal's numbers, commit 3609060): kept unchanged on purpose.
extend-exclude = ["scripts", "pilot", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "T20"]   # T20 = no print(); logging is used instead

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
