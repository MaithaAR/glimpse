[project]
name = "glimpse"
version = "0.2.0"
description = "GLIMPSE: pre-meal glucose-spike risk from a meal photo, pre-meal CGM trend and profile, with calibrated risk and abstention."
authors = [{ name = "Maitha Alhosani", email = "maithaalhosani@icloud.com" }]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "torch>=2.9,<3",
  "torchvision>=0.24,<1",
  "timm>=1.0,<2",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<27",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "pyyaml>=6.0,<7",
  "pydantic>=2.10,<3",
  "loguru>=0.7,<1",
  "pillow>=11,<14",
  "matplotlib>=3.9,<4",
  "remotezip>=0.12,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
glimpse = "glimpse.cli:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glimpse"]

# Linux (the grader's container) installs CPU-only torch; macOS uses PyPI (MPS available).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["pilot"]   # archived proposal-stage scripts (Python 3.11 era), kept unchanged as evidence

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "T20"]   # T20 = no print()

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
